# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.14.1"
  python_check_max: "3.14"
  cov_run: coverage run --source=lintrunner_adapters --branch --append

package:
  name: lintrunner-adapters
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lintrunner-adapters/lintrunner_adapters-${{ version }}.tar.gz
  sha256: 5bae960e99ff71d1a2bf4a51b6bf6dd066f3170627dcadb0802eb70237af182d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - lintrunner_adapters = lintrunner_adapters.__main__:cli

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - click >=8.1.3
    - python >=${{ python_min }}
    - setuptools

tests:
  - python:
      imports: lintrunner_adapters
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - pyproject.toml
    requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
        # from requirements-test.txt
        - defusedxml >=0.7.1
        - pyupgrade ==3.3.1
        - refurb ==1.10.0
        - ufmt ==2.0.1
    script:
      - ${{ cov_run }} -m lintrunner_adapters --help
      - ${{ cov_run }} -m lintrunner_adapters run --help
      - ${{ cov_run }} -m lintrunner_adapters to-sarif --help
      - ${{ cov_run }} -m pytest -vv --tb=long --color=yes --pyargs lintrunner_adapters
      - coverage report --show-missing --skip-covered --fail-under=49

about:
  summary: Adapters and tools for lintrunner
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/lintrunner-adapters
  repository: https://github.com/justinchuby/lintrunner-adapters

extra:
  recipe-maintainers:
    - bollwyvl
